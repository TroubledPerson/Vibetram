{
  "name": "Vibetram offline source and unsigned Android qualification",
  "on": {
    "pull_request": null,
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "compile_native": {
          "description": "Attempt clean native dependencies and unsigned APK on the standard free runner",
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "offline-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "source-checks": {
      "runs-on": "windows-latest",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "run": "python -B ci/test_source_policy.py"
        },
        {
          "run": "python -B ci/check_source.py"
        },
        {
          "run": "python -B ci/test_runner_preflight.py"
        },
        {
          "run": "python -B ci/test_provision_rust.py"
        },
        {
          "run": "python -B ci/test_build_guard.py"
        },
        {
          "run": "python -B ci/test_lock_diagnostic.py"
        },
        {
          "run": "python -B ci/test_lock_repair.py"
        },
        {
          "run": "python -B ci/test_msvc_env.py"
        },
        {
          "run": "python -B ci/test_reparse_metadata.py"
        },
        {
          "run": "python -B ci/test_alias_accounting.py"
        },
        {
          "run": "python -B ci/test_msvc_pins.py"
        },
        {
          "run": "python -B ci/test_scratch_snapshot.py"
        },
        {
          "run": "python -B ci/test_scan_efficiency.py"
        }
      ]
    },
    "unsigned-qualification": {
      "if": "github.event_name == 'push' && contains(github.event.head_commit.message, '[unsigned-trial-191]') && github.ref == 'refs/heads/main' && github.repository == 'TroubledPerson/Vibetram'",
      "needs": [
        "source-checks",
        "lock-diagnostic"
      ],
      "runs-on": "windows-latest",
      "timeout-minutes": 120,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Provision exact Rust in this build VM",
          "timeout-minutes": 12,
          "run": "python -B ci/provision_rust.py"
        },
        {
          "name": "Require this build VM prerequisites",
          "run": "python -B ci/runner_preflight.py --require-qualified"
        },
        {
          "name": "Bounded unsigned clean build and offline checks",
          "timeout-minutes": 95,
          "run": "python -B ci/cloud_build.py"
        },
        {
          "uses": "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f",
          "with": {
            "name": "offline-unsigned-${{ github.sha }}",
            "path": "dist/*",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        },
        {
          "uses": "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f",
          "if": "always()",
          "with": {
            "name": "unsigned-audit-${{ github.sha }}",
            "path": "preflight-output/*.json\nprovision-output/*.json\nci-work/failure-summary.json\nci-work/compiled-dependency-notice-check.json\nci-work/trial-progress.json\nci-work/msvc-qualification.json",
            "if-no-files-found": "warn",
            "retention-days": 3
          }
        }
      ]
    },
    "release": {
      "if": "${{ false }}",
      "needs": "unsigned-qualification",
      "runs-on": "windows-latest",
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "run": "throw 'CI signing and signed-release policy have not been approved; no release created'"
        }
      ]
    },
    "runner-preflight": {
      "if": "github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'TroubledPerson/Vibetram'",
      "needs": "source-checks",
      "runs-on": "windows-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "read"
      },
      "outputs": {
        "qualified": "${{ steps.inspect.outputs.qualified }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Explicit pinned Rust setup (trusted provisioning commit only)",
          "if": "github.event_name == 'push' && contains(github.event.head_commit.message, '[provision-rust195]')",
          "timeout-minutes": 12,
          "run": "python -B ci/provision_rust.py"
        },
        {
          "id": "inspect",
          "run": "python -B ci/runner_preflight.py"
        },
        {
          "uses": "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f",
          "with": {
            "name": "runner-preflight-${{ github.sha }}",
            "path": "preflight-output/runner-preflight.json",
            "if-no-files-found": "error",
            "retention-days": 3
          }
        },
        {
          "uses": "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f",
          "if": "always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[provision-rust195]')",
          "with": {
            "name": "rust-provisioning-${{ github.sha }}",
            "path": "provision-output/provisioning.json",
            "if-no-files-found": "warn",
            "retention-days": 3
          }
        }
      ]
    },
    "lock-diagnostic": {
      "if": "github.event_name == 'push' && contains(github.event.head_commit.message, '[lock-diagnostic-191]') && github.ref == 'refs/heads/main' && github.repository == 'TroubledPerson/Vibetram'",
      "needs": "source-checks",
      "runs-on": "windows-latest",
      "timeout-minutes": 25,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Provision pinned metadata toolchain",
          "timeout-minutes": 12,
          "run": "python -B ci/provision_rust.py"
        },
        {
          "name": "Require this diagnostic VM prerequisites",
          "run": "python -B ci/runner_preflight.py --require-qualified"
        },
        {
          "name": "No-compile disposable lock and pinned-link diagnosis",
          "timeout-minutes": 12,
          "run": "python -B ci/lock_diagnostic.py"
        },
        {
          "uses": "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f",
          "if": "always()",
          "with": {
            "name": "lock-diagnostic-${{ github.sha }}",
            "path": "lock-diagnostic-output/*\npreflight-output/*.json\nprovision-output/*.json",
            "if-no-files-found": "warn",
            "retention-days": 3
          }
        }
      ]
    },
    "msvc-probe": {
      "if": "github.event_name == 'push' && contains(github.event.head_commit.message, '[msvc-probe-191]') && github.ref == 'refs/heads/main' && github.repository == 'TroubledPerson/Vibetram'",
      "needs": "source-checks",
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Provision exact Rust for tiny link qualification",
          "timeout-minutes": 12,
          "run": "python -B ci/provision_rust.py"
        },
        {
          "name": "Require this qualification VM prerequisites",
          "run": "python -B ci/runner_preflight.py --require-qualified"
        },
        {
          "name": "Tiny installed Microsoft x64 linker qualification only",
          "timeout-minutes": 5,
          "run": "python -B ci/msvc_probe.py"
        },
        {
          "uses": "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f",
          "if": "always()",
          "with": {
            "name": "msvc-probe-${{ github.sha }}",
            "path": "msvc-probe-work/msvc-qualification.json\nmsvc-probe-work/failure-summary.json\nmsvc-probe-work/trial-progress.json\npreflight-output/*.json\nprovision-output/*.json\nmsvc-probe-work/reparse-stop.json",
            "if-no-files-found": "warn",
            "retention-days": 3
          }
        }
      ]
    }
  }
}
